<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="BLACKOT">
  <title>BLACKOT</title>
  <defs>
    <radialGradient id="bg" cx=".5" cy=".38" r=".85">
      <stop offset="0" stop-color="#1b1036"/>
      <stop offset="1" stop-color="#04040a"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".5" stop-color="#b79bff"/>
      <stop offset="1" stop-color="#6a3df0"/>
    </linearGradient>
    <clipPath id="front"><rect x="0" y="32" width="64" height="40"/></clipPath>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#bg)"/>
  <!-- accretion ring, back half (hidden behind the B) -->
  <g transform="rotate(-22 32 32)">
    <ellipse cx="32" cy="32" rx="27" ry="9" fill="none" stroke="url(#ring)" stroke-width="3.2"/>
  </g>
  <!-- B -->
  <path d="M23.5 16.5V47.5M23.5 16.5H33a7.25 7.25 0 0 1 0 14.5H23.5M23.5 31H35a8.25 8.25 0 0 1 0 16.5H23.5" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="square" stroke-linejoin="miter"/>
  <!-- accretion ring, front half (passes over the B) -->
  <g transform="rotate(-22 32 32)">
    <ellipse cx="32" cy="32" rx="27" ry="9" fill="none" stroke="url(#ring)" stroke-width="3.2" clip-path="url(#front)"/>
  </g>
</svg>
